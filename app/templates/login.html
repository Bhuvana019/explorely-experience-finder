<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Explorely</title><link rel="stylesheet" href="css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>.auth-page{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:48px 16px;background:var(--surface-bright)}.auth-card{width:min(100%,460px);padding:36px;background:var(--surface-card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-level-2)}.auth-card h1{margin:0 0 8px;font-size:30px}.auth-muted{color:var(--text-muted);margin:0 0 26px}.auth-field{display:block;margin:16px 0 6px;font-size:13px;font-weight:700}.auth-input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-card);color:var(--on-surface);font:inherit}.auth-submit{width:100%;margin-top:22px;justify-content:center}.auth-foot{text-align:center;margin:20px 0 0;font-size:14px}.auth-error{color:#b42318;font-size:13px;min-height:18px}</style></head>
<body><header class="site-header"><div class="container navbar"><a href="index.html" class="brand-logo"><div class="brand-icon-box">✦</div><div class="brand-text"><span class="brand-name">Explorely</span><span class="brand-tag">Curated India</span></div></a><a href="explore.html" class="nav-link">Continue exploring</a></div></header>
<main class="auth-page"><section class="auth-card"><h1>Welcome back</h1><p class="auth-muted">Log in to save places and share your experiences.</p><form id="login-form" novalidate><label class="auth-field" for="login-email">Email address</label><input class="auth-input" id="login-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label class="auth-field" for="login-password">Password</label><input class="auth-input" id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><p class="auth-error" id="login-error" role="alert"></p><button class="search-submit-btn auth-submit" type="submit">Log in</button></form><p class="auth-foot">New to Explorely? <a href="signup.html">Create an account</a></p></section></main>
<script src="js/api.js"></script><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
